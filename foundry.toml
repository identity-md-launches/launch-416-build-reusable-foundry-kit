[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = []
gas_limit = 300000000

[profile.default.fuzz]
runs = 64

[fmt]
line_length = 120
ignore = ["lib/**"]
